name: CI

on:
  pull_request:
    branches: [master]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JVM tests, lint, and release build
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Test and build
        run: >-
          ./gradlew --continue
          :bedatastore:testDebugUnitTest :bedatastore:lintRelease
          :bedatastore:publishReleasePublicationToMavenLocal
          :app:assembleDebug :benchmark:assembleReleaseAndroidTest
          -Dmaven.repo.local="$RUNNER_TEMP/maven"

      - name: Upload Maven publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bedatastore-maven
          path: ${{ runner.temp }}/maven/com/github/bakad3v/bedatastore/
          if-no-files-found: error

      - name: Upload JVM and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-and-lint-reports
          path: |
            bedatastore/build/test-results/testDebugUnitTest/*.xml
            bedatastore/build/reports/lint-results-release.*

  android:
    name: Android tests (API ${{ matrix.api-level }})
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run library instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          system-image-api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: ./gradlew :bedatastore:connectedDebugAndroidTest

      - name: Upload Android test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports-api-${{ matrix.api-level }}
          path: bedatastore/build/outputs/androidTest-results/connected/
